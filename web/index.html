<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forth 工作台</title><style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#dce7ef;background:#0d141c}*{box-sizing:border-box}body{margin:0}header{padding:30px 40px;border-bottom:1px solid #283747;display:flex;align-items:center;justify-content:space-between;gap:24px}h1{margin:0;font-size:27px;font-weight:600;letter-spacing:-.6px}.sub{color:#8193a6;font-size:13px;line-height:1.8;margin:9px 0 0}.badge{font-size:11px;color:#8dc6b9;border:1px solid #32554e;border-radius:20px;padding:7px 13px;white-space:nowrap}main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,1fr);gap:24px;padding:28px 40px;max-width:1500px;margin:auto}.card{border:1px solid #29394a;border-radius:12px;overflow:hidden;background:#121c27;min-width:0}.bar{padding:17px 20px;background:#172330;display:flex;justify-content:space-between;align-items:center;gap:12px}h2{font-size:13px;font-weight:500;margin:0;color:#a9bdce}.bar span{font:11px Consolas,monospace;color:#6d869d}select,button,input{font:inherit;font-size:12px;border:1px solid #35495c;border-radius:6px;background:#1e2d3c;color:#d6e2ec;padding:9px 12px}select{max-width:100%}button{cursor:pointer}button:hover{background:#304456}button:disabled{opacity:.4;cursor:default}.controls{padding:16px 20px;display:flex;gap:9px;flex-wrap:wrap}#run{background:#8dd7ba;border-color:#8dd7ba;color:#0f3027;font-weight:600}#stop{color:#e2b09b}textarea{display:block;width:100%;height:345px;resize:vertical;border:0;border-top:1px solid #223244;border-bottom:1px solid #223244;background:#0b1520;color:#c7e2d8;padding:24px;font:14px/1.8 Consolas,"Microsoft YaHei",monospace;tab-size:2;outline-offset:-2px}.note{color:#7e92a6;font-size:12px;line-height:1.8;padding:0 20px 15px;margin:0}.right{display:flex;flex-direction:column;gap:20px;min-width:0}#terminal{margin:0;padding:22px;min-height:255px;max-height:400px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 Consolas,"Microsoft YaHei",monospace;background:#09131c;color:#c6d9e5}#stack{padding:18px;display:flex;gap:8px;flex-wrap:wrap;min-height:70px}.cell{padding:7px 11px;border-radius:5px;border:1px solid #3b586c;color:#abd4e7;background:#1b2c3d;font:13px Consolas,monospace}.empty{color:#667e91;font-size:12px}.statebar{padding:15px 20px;border-top:1px solid #233546;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}#status{color:#8ab4aa;font-size:12px;line-height:1.7}#status.error{color:#e7a393}#mode{font-size:11px;color:#85bcae}.help{max-width:1500px;margin:auto;padding:0 40px 26px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;color:#738b9f;font-size:12px;line-height:1.9}a{color:#8fbaca;text-decoration:none;margin-right:18px}code{font-family:Consolas,monospace;color:#a8c5cd}@media(max-width:850px){header{padding:24px 20px;flex-wrap:wrap}main{grid-template-columns:1fr;padding:20px;gap:18px}.help{padding:0 20px 24px}.bar{flex-wrap:wrap}textarea{height:310px;padding:18px}#terminal{min-height:180px}}
</style></head><body><header><div><h1>Forth 工作台</h1><p class="sub">写下几个词，看它们怎样改变栈。定义与数据会保留在当前会话。</p></div><span class="badge">MoonBit 0.19.0 · 本地运行</span></header><main><section class="card"><div class="bar"><h2><label for="source">程序</label></h2><select id="example" aria-label="载入示例"><option value="hello">字符串与平方</option><option value="loop">循环与累加</option><option value="error">捕获错误</option><option value="compile">多行定义 · 第一段</option></select></div><textarea id="source" spellcheck="false"></textarea><div class="controls"><button id="run">运行程序</button><button id="feed">发送片段</button><button id="stop" disabled>停止</button><button id="reset">重置会话</button></div><p class="note">完整程序使用「运行程序」。分段输入定义时使用「发送片段」，继续输入直到分号 <code>;</code>。停止会结束当前会话；重置会清空已有词和数据。</p></section><section class="right"><div class="card"><div class="bar"><h2>输出</h2><span>UTF-8 · 实时会话</span></div><pre id="terminal" aria-label="程序输出">会话准备中…</pre><div class="statebar"><span id="status" role="status" aria-live="polite">正在准备…</span><button id="download" disabled>下载本次输出</button></div></div><div class="card"><div class="bar"><h2>数据栈 <span id="count">0</span></h2><span id="mode">解释模式</span></div><div id="stack"><span class="empty">空栈</span></div><p class="note">从左到右：栈底 → 栈顶。最多显示最近 64 个值。</p></div></section></main><footer class="help"><span>32 位整数 · UTF-8 字节字符串 · 有执行上限的本地会话<br>支持核心词的已实现子集，尚非完整 ANS Forth。</span><div><a href="../README.md">使用说明</a><a href="../WORDS.md">词与行为边界</a><a href="../TESTING.md">验证记录</a></div></footer><script type="module" src="./app.mjs"></script></body></html>
